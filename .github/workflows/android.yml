name: Jex AI APK Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Jex AI App
    runs-on: ubuntu-latest

    steps:
      # 1. Repository se code checkout karna
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java Environment Setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Automatic gradlew file dhoondhna aur use permission dena
      - name: Grant Execute Permission to Gradlew
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file nahi mili!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # 4. Missing properties files ki galti ko rokne ke liye khali dummy files banana
      - name: Create Dummy Properties Files
        run: |
          touch keystore.properties
          touch license-config.properties
          echo "storeFile=dummy" >> keystore.properties
          echo "storePassword=dummy" >> keystore.properties
          echo "keyAlias=dummy" >> keystore.properties
          echo "keyPassword=dummy" >> keystore.properties
        working-directory: ${{ env.GRADLEW_DIR }}

      # 5. Jex AI App ka Debug APK build karna (Sirf direct variant ke liye taaki koi confusion na ho)
      - name: Build Debug APK
        run: ./gradlew assembleDirectDebug
        working-directory: ${{ env.GRADLEW_DIR }}

      # 6. Build huye APK ko artifact mein upload karna
      - name: Upload Build APK
        uses: actions/upload-artifact@v4
        with:
          name: jex-ai-debug-apk
          path: "**/build/outputs/apk/direct/debug/*.apk"
          
