name: Jex AI APK Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Jex AI App
    runs-on: ubuntu-latest

    steps:
      # 1. Repository se code checkout karna
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java Environment Setup (modern Kotlin DSL ke liye Java 17 standard hai)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Automatic gradlew file dhoondhna aur use permission dena
      - name: Grant Execute Permission to Gradlew
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file nahi mili!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # 4. Jex AI App ka Debug APK build karna (Bina kisi folder error ke)
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.GRADLEW_DIR }}

      # 5. Build huye APK ko artifact mein upload karna taaki aap ise download kar sakein
      - name: Upload Build APK
        uses: actions/upload-artifact@v4
        with:
          name: jex-ai-debug-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
          
